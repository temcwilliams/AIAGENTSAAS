name: RelayVoice
options:
  bundleIdPrefix: com.example.relay
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  RelayVoice:
    type: application
    platform: iOS
    sources: [RelayVoice]
    info:
      path: RelayVoice/Info.plist
      properties:
        CFBundleDisplayName: Relay Voice
        NSMicrophoneUsageDescription: Relay listens during voice sessions you start, so you can speak to your own AI.
        NSSpeechRecognitionUsageDescription: Relay transcribes your speech on this device. Unsupported on-device languages are not sent to cloud recognition.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: RelayVoice
            CFBundleURLSchemes: [relayvoice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.relay.voice
        GENERATE_INFOPLIST_FILE: NO
  RelayVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RelayVoiceTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RelayVoice
schemes:
  RelayVoice:
    build:
      targets:
        RelayVoice: all
        RelayVoiceTests: [test]
    test:
      targets: [RelayVoiceTests]
